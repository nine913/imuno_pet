<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Epidemiológico - Órgão Governamental</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #000000; margin-top: 0; }
        .btn-voltar { background-color: #6c757d; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-bottom: 20px; }
        .btn-voltar:hover { background-color: #5a6268; }
        .layout-grid { display: flex; gap: 25px; flex-wrap: wrap; margin-bottom: 30px; }
        .box { flex: 1; min-width: 400px; background-color: #fdfdfd; border: 1px solid #e3e3e3; padding: 20px; border-radius: 8px; box-sizing: border-box; }
        .tabela-risco { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .tabela-risco th, .tabela-risco td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .tabela-risco th { background-color: #fd7e14; color: white; }
        .tabela-risco tr:nth-child(even) { background-color: #f2f2f2; }
        .risco-alto { color: #dc3545; font-weight: bold; }
        .risco-medio { color: #fd7e14; font-weight: bold; }
        .risco-baixo { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-voltar" onclick="window.location.href='../dashboard.html'">Voltar ao Painel</button>
        <h2>Monitoramento Epidemiológico</h2>
        
        <div class="layout-grid">
            <div class="box">
                <h3>Cobertura Vacinal por Espécie</h3>
                <canvas id="chartEspecie"></canvas>
            </div>
            
            <div class="box" style="flex: 2;">
                <h3>Mapeamento de Risco por Localidade</h3>
                <table class="tabela-risco">
                    <thead>
                        <tr>
                            <th>Bairro</th>
                            <th>Cidade</th>
                            <th>Doses Aplicadas</th>
                            <th>Doses Atrasadas</th>
                            <th>Nível de Risco</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabelaRisco">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="orgao-dashboard.js"></script>
</body>
</html>
