<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - ImunoPet Brasil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .navbar {
            background-color: #0056b3;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
        }
        .navbar button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .navbar button:hover {
            background-color: #c82333;
        }
        .content {
            margin-top: 20px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .pet-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            background-color: #fdfdfd;
        }
        .pet-card h3 {
            margin-top: 0;
            color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h2 style="margin: 0;">ImunoPet Brasil</h2>
        <button id="btnSair">Sair</button>
    </div>

    <div class="content">
        <h1 id="boasVindas">Carregando...</h1>
        
        <div id="areaTutor" style="display: none;">
            <h2>Meus Pets</h2>
            <div id="listaPets"></div>
        </div>
    </div>

    <script>
        const usuarioString = localStorage.getItem('usuarioImunoPet');
        
        if (!usuarioString) {
            window.location.href = 'index.html';
        } else {
            const usuario = JSON.parse(usuarioString);
            document.getElementById('boasVindas').textContent = `Bem-vindo! Você está logado como: ${usuario.perfil}`;

            if (usuario.perfil === 'TUTOR') {
                document.getElementById('areaTutor').style.display = 'block';
                carregarPets(usuario.id_usuario);
            }
        }

        document.getElementById('btnSair').addEventListener('click', () => {
            localStorage.removeItem('usuarioImunoPet');
            window.location.href = 'index.html';
        });

        async function carregarPets(idUsuario) {
            const divListaPets = document.getElementById('listaPets');
            
            try {
                const resposta = await fetch(`http://localhost:3000/meus-pets/${idUsuario}`);
                const pets = await resposta.json();

                if (pets.length === 0) {
                    divListaPets.innerHTML = '<p>Nenhum pet cadastrado ainda.</p>';
                    return;
                }

                pets.forEach(pet => {
                    const dataNasc = new Date(pet.data_nascimento).toLocaleDateString('pt-BR');
                    
                    const petCard = document.createElement('div');
                    petCard.className = 'pet-card';
                    petCard.innerHTML = `
                        <h3>${pet.nome}</h3>
                        <p><strong>Espécie:</strong> ${pet.especie}</p>
                        <p><strong>Raça:</strong> ${pet.raca}</p>
                        <p><strong>Data de Nascimento:</strong> ${dataNasc}</p>
                    `;
                    divListaPets.appendChild(petCard);
                });
            } catch (erro) {
                divListaPets.innerHTML = '<p style="color: red;">Erro ao carregar os pets.</p>';
            }
        }
    </script>
</body>
</html>
