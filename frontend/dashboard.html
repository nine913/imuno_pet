<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - ImunoPet Brasil</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .navbar { background-color: #0056b3; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; }
        .navbar button { background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .navbar button:hover { background-color: #c82333; }
        .content { margin-top: 20px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-vet { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 10px; margin-top: 10px; }
        .btn-vet:hover { background-color: #218838; }
        .btn-tutor { background-color: #17a2b8; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 10px; margin-top: 10px; font-weight: bold; }
        .btn-tutor:hover { background-color: #138496; }
    </style>
</head>
<body>
    <div class="navbar">
        <h2 style="margin: 0;">ImunoPet Brasil</h2>
        <button id="btnSair">Sair</button>
    </div>

    <div class="content">
        <h1 id="boasVindas">Carregando...</h1>
        
        <div id="areaTutor" style="display: none;">
            <h2>Painel do Tutor</h2>
            <p>Acesse as informações dos seus animais e carteiras de vacinação:</p>
            <button class="btn-tutor" onclick="window.location.href='tutor/tutor-animais.html'">Meus Pets e Vacinas</button>
        </div>

        <div id="areaVeterinario" style="display: none;">
            <h2>Painel do Veterinário</h2>
            <p>Selecione uma ação abaixo:</p>
            <button class="btn-vet" onclick="window.location.href='veterinario/vet-buscar.html'">Gerenciar Animais</button>
            <button class="btn-vet" onclick="window.location.href='veterinario/vet-tutores.html'">Gerenciar Tutores</button>
            <button class="btn-vet" onclick="window.location.href='veterinario/vet-vacinas.html'">Gerenciar Vacinas</button>
            <button class="btn-vet" onclick="window.location.href='veterinario/vet-relatorio.html'" style="background-color: #17a2b8;">Relatório de Vacinação</button>
        </div>
    </div>

    <script>
        const usuarioString = localStorage.getItem('usuarioImunoPet');
        
        if (!usuarioString) {
            window.location.href = 'index.html';
        } else {
            const usuario = JSON.parse(usuarioString);
            document.getElementById('boasVindas').textContent = `Bem-vindo! Você está logado como: ${usuario.perfil}`;

            if (usuario.perfil === 'TUTOR') {
                document.getElementById('areaTutor').style.display = 'block';
            } else if (usuario.perfil === 'VETERINARIO') {
                document.getElementById('areaVeterinario').style.display = 'block';
            }
        }

        document.getElementById('btnSair').addEventListener('click', () => {
            localStorage.removeItem('usuarioImunoPet');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
