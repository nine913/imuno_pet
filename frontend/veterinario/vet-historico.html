<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Vacinação</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #0056b3; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 5px; }
        .btn-acao { background-color: #28a745; width: 100%; }
        .btn-acao:hover { background-color: #218838; }
        .btn-voltar { background-color: #6c757d; margin-bottom: 20px; }
        .btn-voltar:hover { background-color: #5a6268; }
        .btn-vet { background-color: #0056b3; margin-top: 0; }
        .btn-vet:hover { background-color: #004494; }
        .resultado-card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-top: 15px; background-color: #fdfdfd; display: flex; justify-content: space-between; align-items: center; }
        .modal-content { display: none; background-color: #e9ecef; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-voltar" onclick="window.location.href='vet-buscar.html'">Voltar para Busca</button>
        
        <h2>Histórico de Vacinação do Paciente</h2>
        
        <div style="display: flex; gap: 10px; flex-direction: column; background-color: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="termoBusca" placeholder="Buscar pelo nome da vacina..." style="flex: 2;">
                <select id="filtroStatus" style="flex: 1;">
                    <option value="">Status da Vacina: Todos</option>
                    <option value="APLICADA">Aplicada</option>
                    <option value="PENDENTE">Pendente (Agendada)</option>
                    <option value="ATRASADA">Atrasada</option>
                </select>
                <button class="btn-vet" id="btnBuscar" style="flex: 1;">Pesquisar</button>
            </div>
        </div>

        <div id="listaHistorico"></div>

        <div id="modalEditarRegistro" class="modal-content">
            <h3>✏️ Editar Registro de Vacina</h3>
            <form id="formEditarRegistro">
                <input type="hidden" id="edit_id_registro">
                
                <label>Vacina:</label>
                <select id="selectVacina" required></select>

                <label>Status:</label>
                <select id="statusVacina" required>
                    <option value="APLICADA">Aplicada</option>
                    <option value="PENDENTE">Agendada (Pendente)</option>
                </select>

                <label id="labelVeterinario" style="display: block;">Veterinário Aplicante:</label>
                <select id="selectVeterinario" style="display: block;" required></select>

                <label>Data de Aplicação (se já aplicada):</label>
                <input type="date" id="data_aplicacao" required>

                <label>Data da Próxima Dose / Vencimento:</label>
                <input type="date" id="data_proxima_dose" required>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="btn-acao">Salvar Alterações</button>
                    <button type="button" class="btn-voltar" style="margin: 0;" onclick="fecharModais()">Cancelar</button>
                </div>
            </form>
            <div id="mensagem"></div>
        </div>

        <div id="modalConfirmacao" class="modal-overlay">
            <div style="background: white; padding: 20px; border-radius: 8px; text-align: center; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
                <h3 style="color: #dc3545; margin-top: 0;">Atenção!</h3>
                <p>Tem certeza que deseja excluir este registro de vacina do histórico?</p>
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                    <button id="btnConfirmarExclusao" style="background-color: #dc3545; color: white; width: auto; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Sim, Excluir</button>
                    <button onclick="fecharModais()" style="background-color: #6c757d; color: white; width: auto; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Cancelar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="vet-historico.js"></script>
</body>
</html>
