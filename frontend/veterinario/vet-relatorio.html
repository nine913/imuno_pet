<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Detalhado - ImunoPet Brasil</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #0056b3; }
        input[type="date"], select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; width: 100%; }
        button { padding: 10px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 5px; }
        .btn-voltar { background-color: #6c757d; }
        .btn-voltar:hover { background-color: #5a6268; }
        .filtros { display: flex; gap: 15px; background-color: #e9ecef; padding: 20px; border-radius: 8px; margin-bottom: 20px; align-items: flex-end; flex-wrap: wrap; }
        .filtro-item { flex: 1; min-width: 150px; }
        .card-resumo { background-color: #28a745; color: white; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .card-resumo h1 { margin: 0; font-size: 48px; }
        .card-resumo p { margin: 5px 0 0 0; font-size: 18px; }
        .tabela-relatorio { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        .tabela-relatorio th, .tabela-relatorio td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .tabela-relatorio th { background-color: #0056b3; color: white; }
        .tabela-relatorio tr:nth-child(even) { background-color: #f2f2f2; }
        
        @media print {
            body { background-color: white; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .botoes-topo, .filtros { display: none !important; }
            .tabela-relatorio { font-size: 12px; }
            .card-resumo { border: 2px solid #28a745; color: black; background-color: white; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="botoes-topo" style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <button class="btn-voltar" onclick="window.location.href='../dashboard.html'" style="margin: 0;">Voltar ao Painel</button>
            <div style="display: flex; gap: 10px;">
                <button onclick="window.print()" style="margin: 0; background-color: #6c757d;">🖨️ Imprimir</button>
                <button onclick="baixarPDF()" style="margin: 0; background-color: #17a2b8;">📄 Baixar PDF</button>
            </div>
        </div>
        
        <div id="area-relatorio">
            <h2>Relatório de Vacinação</h2>
            
            <div class="filtros" data-html2canvas-ignore="true">
                <div class="filtro-item">
                    <label>Data Inicial:</label>
                    <input type="date" id="data_inicio">
                </div>
                <div class="filtro-item">
                    <label>Data Final:</label>
                    <input type="date" id="data_fim">
                </div>
                <div class="filtro-item">
                    <label>Status:</label>
                    <select id="filtro_status">
                        <option value="">Todos</option>
                        <option value="APLICADA">Aplicada</option>
                        <option value="PENDENTE">Pendente</option>
                        <option value="ATRASADA">Atrasada</option>
                    </select>
                </div>
                <div class="filtro-item">
                    <label>Espécie:</label>
                    <select id="filtro_especie">
                        <option value="">Todas</option>
                        <option value="Cachorro">Cachorro</option>
                        <option value="Gato">Gato</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
                <button id="btnGerarRelatorio" style="flex: 1; height: 38px; margin-bottom: 1px; background-color: #0056b3;">Filtrar</button>
            </div>

            <div class="card-resumo">
                <h1 id="totalGeral">0</h1>
                <p>Registros Encontrados no Período</p>
            </div>

            <table class="tabela-relatorio">
                <thead>
                    <tr>
                        <th>Data Aplicação</th>
                        <th>Vencimento</th>
                        <th>Vacina</th>
                        <th>Pet</th>
                        <th>Espécie</th>
                        <th>Raça</th>
                        <th>Tutor</th>
                        <th>Telefone</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                </tbody>
            </table>
        </div>
    </div>

    <script src="vet-relatorio.js"></script>
</body>
</html>
