<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Vacinas - ImunoPet Brasil</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #0056b3; margin-top: 0; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 5px; }
        button:hover { background-color: #218838; }
        .btn-acao { background-color: #ffc107; color: #333; width: 100%; }
        .btn-voltar { background-color: #6c757d; margin-bottom: 20px; width: auto; }
        .btn-voltar:hover { background-color: #5a6268; }
        .resultado-card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-top: 15px; background-color: #fdfdfd; display: flex; justify-content: space-between; align-items: center; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .modal-content-small { text-align: center; width: 300px; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-voltar" onclick="window.location.href='../dashboard.html'">Voltar ao Painel</button>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin: 0;">Consultar Vacinas</h2>
            <button onclick="window.location.href='vet-cadastrar-vacina.html'" style="background-color: #28a745; width: auto; margin: 0; padding: 10px 20px;">+ Cadastrar Nova Vacina</button>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="termoBusca" placeholder="Pesquisar por nome, doenças ou fabricante...">
            <button id="btnBuscar" style="background-color: #0056b3;">Pesquisar</button>
        </div>

        <div id="listaVacinas"></div>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <h3>Editar Vacina</h3>
            <form id="formEditarVacina">
                <input type="hidden" id="edit_id_vacina">
                <input type="text" id="edit_nome_vacina" placeholder="Nome da Vacina" required>
                <textarea id="edit_doencas_prevenidas" placeholder="Doenças Prevenidas" rows="3" required></textarea>
                <input type="text" id="edit_fabricante" placeholder="Fabricante">
                
                <select id="edit_tipo_dose" required>
                    <option value="unica">Dose Única</option>
                    <option value="intervalo">Múltiplas Doses (Com Intervalo)</option>
                </select>

                <input type="number" id="edit_intervalo_dose_dias" placeholder="Intervalo entre doses (em dias)" min="0" style="display: none;">
                
                <button type="submit" class="btn-acao">Salvar Alterações</button>
                <button type="button" onclick="fecharModalEditar()" style="background-color: #6c757d; width: 100%;">Cancelar</button>
            </form>
            <div id="mensagemEditar" style="text-align: center; margin-top: 10px; font-weight: bold;"></div>
        </div>
    </div>

    <div id="modalConfirmacao" class="modal">
        <div class="modal-content modal-content-small">
            <h3 style="color: #dc3545; margin-top: 0;">Atenção!</h3>
            <p>Deseja excluir esta vacina? Isso apagará este registro de todos os animais vacinados com ela.</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button id="btnConfirmarExclusao" style="background-color: #dc3545; color: white; width: auto; padding: 10px 20px;">Sim, Excluir</button>
                <button onclick="fecharModalExclusao()" style="background-color: #6c757d; color: white; width: auto; padding: 10px 20px;">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="vet-vacinas.js"></script>
</body>
</html>
