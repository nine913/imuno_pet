<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Animal - Veterinário</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #0056b3; }
        input[type="text"], input[type="date"], select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 5px; }
        button:hover { background-color: #004494; }
        .btn-acao { background-color: #28a745; width: 100%; }
        .btn-acao:hover { background-color: #218838; }
        .btn-voltar { background-color: #6c757d; margin-bottom: 20px; }
        .btn-voltar:hover { background-color: #5a6268; }
        .resultado-card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-top: 15px; background-color: #fdfdfd; display: flex; justify-content: space-between; align-items: center; }
        #modalVacina { display: none; background-color: #e9ecef; padding: 20px; border-radius: 8px; margin-top: 20px; }
        #mensagem { font-weight: bold; margin-top: 10px; text-align: center; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-voltar" onclick="window.location.href='../dashboard.html'">Voltar ao Painel</button>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
    <h2 style="margin: 0;">Buscar Animal</h2>
    <button onclick="window.location.href='vet-cadastrar-pet.html'" style="background-color: #28a745; width: auto; margin: 0; padding: 10px 20px;">+ Cadastrar Novo Pet</button>
</div>
        
        <div style="display: flex; gap: 10px; flex-direction: column; background-color: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="termoBusca" placeholder="Digite o nome do pet, tutor ou CPF" style="flex: 2;">
            </div>
            
            <div style="display: flex; gap: 10px;">
                <input type="text" id="filtroVacina" placeholder="Filtro opcional: Nome da Vacina" style="flex: 1;">
                <select id="filtroStatus" style="flex: 1;">
                    <option value="">Status da Vacina: Todos</option>
                    <option value="APLICADA">Aplicada</option>
                    <option value="PENDENTE">Pendente (Agendada)</option>
                </select>
                <button id="btnBuscar" style="flex: 1;">Aplicar Filtros e Pesquisar</button>
            </div>
        </div>

        <div id="listaResultados"></div>

        <div id="modalVacina">
            <h3 id="tituloPetSelecionado">Registrar Vacina para: </h3>
            <form id="formVacina">
                <input type="hidden" id="id_animal_selecionado">
                
                <label>Vacina:</label>
                <select id="selectVacina" required>
                    <option value="">Selecione a vacina...</option>
                </select>

                <label>Status:</label>
                <select id="statusVacina" required>
                    <option value="APLICADA">Aplicada</option>
                    <option value="PENDENTE">Agendada (Pendente)</option>
                </select>

                <label>Data de Aplicação (se já aplicada):</label>
                <input type="date" id="data_aplicacao">

                <label>Data da Próxima Dose / Vencimento:</label>
                <input type="date" id="data_proxima_dose" required>

                <button type="submit" class="btn-acao">Salvar Registro</button>
            </form>
            <div id="mensagem"></div>
        </div>
    </div>

    <div id="modalConfirmacao" class="modal">
        <div style="background: white; padding: 20px; border-radius: 8px; text-align: center; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
            <h3 style="color: #dc3545; margin-top: 0;">Atenção!</h3>
            <p>Tem certeza que deseja excluir este animal e todo o seu histórico de vacinas?</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button id="btnConfirmarExclusao" style="background-color: #dc3545; color: white; width: auto; padding: 10px 20px;">Sim, Excluir</button>
                <button onclick="fecharModalExclusao()" style="background-color: #6c757d; color: white; width: auto; padding: 10px 20px;">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="vet-buscar.js"></script>
</body>
</html>
