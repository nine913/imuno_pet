<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacinas Atrasadas - ImunoPet Brasil</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #dc3545; margin-top: 0; }
        .btn-voltar { background-color: #6c757d; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-bottom: 20px; }
        .btn-voltar:hover { background-color: #5a6268; }
        .atrasado-card { border: 1px solid #f5c6cb; padding: 15px; border-radius: 8px; margin-top: 15px; background-color: #f8d7da; display: flex; justify-content: space-between; align-items: center; color: #721c24; }
        .btn-contato { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; }
        .btn-contato:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-voltar" onclick="window.location.href='../dashboard.html'">Voltar ao Painel</button>
        <h2>⚠️ Controle de Vacinação Atrasada</h2>
        <p>Lista de pacientes com doses pendentes após a data de vencimento:</p>
        <div id="listaAtrasados"></div>
    </div>
    <script src="vet-atrasados.js"></script>
</body>
</html>
