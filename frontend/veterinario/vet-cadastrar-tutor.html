<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Tutor e Pet - ImunoPet Brasil</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .cadastro-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 600px; max-width: 100%; }
        h2, h3 { text-align: center; color: #0056b3; margin-top: 0; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px; font-weight: bold; }
        button:hover { background-color: #218838; }
        .btn-voltar { background-color: #6c757d; }
        .btn-voltar:hover { background-color: #5a6268; }
        #mensagem { text-align: center; margin-top: 15px; font-weight: bold; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="cadastro-container">
        <h2>Cadastrar Tutor e Pet</h2>
        <form id="formCadastroTutorPet">
            <h3>Dados do Tutor</h3>
            <div class="row">
                <div class="col"><input type="text" id="nome_completo" placeholder="Nome Completo" required></div>
                <div class="col"><input type="text" id="cpf" placeholder="CPF (apenas números)" maxlength="14" required></div>
            </div>
            <div class="row">
                <div class="col"><input type="email" id="email" placeholder="E-mail" required></div>
                <div class="col"><input type="password" id="senha" placeholder="Senha de Acesso" required></div>
            </div>
            <div class="row">
                <div class="col"><input type="tel" id="telefone" placeholder="Telefone" required maxlength="15"></div>
                <div class="col"><input type="text" id="estado" placeholder="Estado (ex: PA)" maxlength="2" required></div>
            </div>
            <div class="row">
                <div class="col"><input type="text" id="cidade" placeholder="Cidade" required></div>
                <div class="col"><input type="text" id="bairro" placeholder="Bairro" required></div>
            </div>

            <hr>

            <h3>Dados do Primeiro Pet</h3>
            <div class="row">
                <div class="col"><input type="text" id="nome_animal" placeholder="Nome do Pet" required></div>
                <div class="col">
                    <select id="especie" required>
                        <option value="">Selecione a Espécie...</option>
                        <option value="Cachorro">Cachorro</option>
                        <option value="Gato">Gato</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col"><input type="text" id="raca" placeholder="Raça" required></div>
                <div class="col"><input type="date" id="data_nascimento" required></div>
            </div>

            <button type="submit">Finalizar Cadastro</button>
            <button type="button" class="btn-voltar" onclick="window.location.href='vet-tutores.html'">Cancelar / Voltar</button>
        </form>
        <div id="mensagem"></div>
    </div>

    <script src="vet-cadastrar-tutor.js"></script>
</body>
</html>
