<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Equipe - Gestor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #000000; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 5px; }
        .btn-acao { background-color: #28a745; width: 100%; }
        .btn-acao:hover { background-color: #218838; }
        .btn-voltar { background-color: #6c757d; margin-bottom: 20px; }
        .btn-voltar:hover { background-color: #5a6268; }
        .btn-vet { background-color: #007bff; margin: 0; }
        .resultado-card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-top: 15px; background-color: #fdfdfd; display: flex; justify-content: space-between; align-items: center; }
        .modal-content { display: none; background-color: #e9ecef; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        #mensagem { font-weight: bold; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-voltar" onclick="window.location.href='../dashboard.html'">Voltar ao Painel</button>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin: 0;">Equipe Veterinária</h2>
            <button onclick="abrirModalCadastro()" style="background-color: #28a745; width: auto; margin: 0;">+ Novo Veterinário</button>
        </div>
        
        <div style="display: flex; gap: 10px; background-color: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <input type="text" id="termoBusca" placeholder="Pesquisar por nome, CRMV ou e-mail..." style="margin: 0; flex: 2;">
            <button id="btnBuscar" class="btn-vet" style="flex: 1;">Pesquisar</button>
        </div>

        <div id="listaResultados"></div>

        <div id="modalForm" class="modal-content">
            <h3 id="tituloModal">Cadastrar Veterinário</h3>
            <form id="formVet">
                <input type="hidden" id="vet_id_veterinario">
                <input type="hidden" id="vet_id_usuario">
                
                <label>Nome Completo:</label>
                <input type="text" id="vet_nome" required>

                <label>CRMV:</label>
                <input type="text" id="vet_crmv" required>

                <label>E-mail de Acesso:</label>
                <input type="email" id="vet_email" required>

                <div id="areaSenha">
                    <label>Senha de Acesso (Criação):</label>
                    <input type="password" id="vet_senha">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="btn-acao">Salvar Dados</button>
                    <button type="button" class="btn-voltar" style="margin: 0;" onclick="fecharModais()">Cancelar</button>
                </div>
            </form>
            <div id="mensagem"></div>
        </div>

        <div id="modalConfirmacao" class="modal-overlay">
            <div style="background: white; padding: 20px; border-radius: 8px; text-align: center; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
                <h3 style="color: #dc3545; margin-top: 0;">Atenção!</h3>
                <p>Confirma a exclusão deste veterinário e de seu acesso ao sistema?</p>
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                    <button id="btnConfirmarExclusao" style="background-color: #dc3545; color: white; width: auto; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Sim, Excluir</button>
                    <button onclick="fecharModais()" style="background-color: #6c757d; color: white; width: auto; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Cancelar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="gestor-equipe.js"></script>
</body>
</html>
