<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Vacina - ImunoPet Brasil</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f4f9; margin: 0; padding: 20px; box-sizing: border-box; }
        .cadastro-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
        h2 { text-align: center; color: #0056b3; margin-top: 0; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; font-weight: bold; }
        button:hover { background-color: #218838; }
        .btn-voltar { background-color: #6c757d; }
        .btn-voltar:hover { background-color: #5a6268; }
        #mensagemCadastro { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="cadastro-container">
        <h2>Cadastrar Nova Vacina</h2>
        <form id="cadastroVacinaForm">
            <input type="text" id="nome_vacina" placeholder="Nome da Vacina (Ex: V10, Antirrábica)" required>
            <textarea id="doencas_prevenidas" placeholder="Doenças Prevenidas (Ex: Cinomose, Parvovirose...)" rows="4" required></textarea>
            <input type="text" id="fabricante" placeholder="Fabricante" required>
            
            <select id="tipo_dose" required>
                <option value="">Selecione o Tipo de Dose...</option>
                <option value="unica">Dose Única</option>
                <option value="intervalo">Múltiplas Doses (Com Intervalo)</option>
            </select>

            <input type="number" id="intervalo_dose_dias" placeholder="Intervalo entre doses (em dias)" min="0" style="display: none;">
            
            <button type="submit">Salvar Vacina</button>
            <button type="button" class="btn-voltar" onclick="window.location.href='vet-vacinas.html'">Cancelar / Voltar</button>
        </form>
        <div id="mensagemCadastro"></div>
    </div>
    <script src="vet-cadastrar-vacina.js"></script>
</body>
</html>
