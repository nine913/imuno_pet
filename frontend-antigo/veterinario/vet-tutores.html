<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Tutores - ImunoPet Brasil</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #0056b3; }
        input[type="text"], input[type="tel"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 5px; }
        button:hover { background-color: #004494; }
        .btn-acao { background-color: #28a745; width: 100%; }
        .btn-acao:hover { background-color: #218838; }
        .btn-voltar { background-color: #6c757d; margin-bottom: 20px; }
        .btn-voltar:hover { background-color: #5a6268; }
        .resultado-card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-top: 15px; background-color: #fdfdfd; display: flex; justify-content: space-between; align-items: center; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .modal-content-small { text-align: center; width: 300px; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-voltar" onclick="window.location.href='../dashboard.html'">Voltar ao Painel</button>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
    <h2 style="margin: 0;">Consultar Tutores</h2>
    <button onclick="window.location.href='vet-cadastrar-tutor.html'" style="background-color: #28a745; width: auto; margin: 0; padding: 10px 20px;">+ Cadastrar Novo Tutor</button>
</div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="termoBusca" placeholder="Digite o nome, CPF ou E-mail">
            <button id="btnBuscar">Pesquisar</button>
        </div>

        <div id="listaResultados"></div>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <h3>Editar Tutor</h3>
            <form id="formEditarTutor">
                <input type="hidden" id="edit_id_tutor">
                <input type="text" id="edit_nome" placeholder="Nome Completo" required>
                <input type="tel" id="edit_telefone" placeholder="Telefone" required maxlength="15">
                <input type="text" id="edit_estado" placeholder="Estado (ex: PA)" maxlength="2" required>
                <input type="text" id="edit_cidade" placeholder="Cidade" required>
                <input type="text" id="edit_bairro" placeholder="Bairro" required>
                
                <button type="submit" class="btn-acao">Salvar Alterações</button>
                <button type="button" onclick="fecharModalEditar()" style="background-color: #6c757d; width: 100%;">Cancelar</button>
            </form>
            <div id="mensagemEditar" style="text-align: center; margin-top: 10px; font-weight: bold;"></div>
        </div>
    </div>

   <div id="modalConfirmacao" class="modal">
        <div class="modal-content modal-content-small">
            <h3 style="color: #dc3545; margin-top: 0;">Atenção!</h3>
            <p>Deseja excluir este tutor? Isso apagará a conta dele, todos os seus animais e registros de vacina.</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button id="btnConfirmarExclusao" style="background-color: #dc3545; color: white; width: auto; padding: 10px 20px;">Sim, Excluir</button>
                <button onclick="fecharModalExclusao()" style="background-color: #6c757d; color: white; width: auto; padding: 10px 20px;">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalErroExclusao" class="modal">
        <div class="modal-content modal-content-small">
            <h3 style="color: #dc3545; margin-top: 0;">Erro na Exclusão</h3>
            <p id="mensagemErroExclusao">O tutor não pode ser excluído.</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button onclick="fecharModalErroExclusao()" style="background-color: #6c757d; color: white; width: auto; padding: 10px 20px;">Fechar</button>
            </div>
        </div>
    </div>

    <script src="vet-tutores.js"></script>
</body>
</html>
